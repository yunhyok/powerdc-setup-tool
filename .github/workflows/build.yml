name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch: {}

# Builds and pull requests need only read access. The release job below is the
# sole job granted contents: write, and it runs only for an actual v* tag push.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    # v0.1.3: the v0.1.2 run hung inside `pytest` and was killed at the 6-hour
    # job ceiling, which produced no logs at all. A tight job ceiling fails fast,
    # and the per-test `timeout` in `pyproject.toml` (180 s, thread method --
    # which dumps every thread's stack) is what names the offending test.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not slow"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Resolve and verify release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $pyproject = Get-Content -Raw pyproject.toml
          $projectMatch = [regex]::Match($pyproject, '(?m)^\s*version\s*=\s*"([^"]+)"\s*$')
          if (-not $projectMatch.Success) { throw "Canonical project version was not found in pyproject.toml." }
          $canonical = $projectMatch.Groups[1].Value

          $package = Get-Content -Raw src\powerdc_setup_tool\__init__.py
          $packageMatch = [regex]::Match($package, '__version__\s*=\s*"([^"]+)"')
          if (-not $packageMatch.Success) { throw "Package __version__ was not found." }
          if ($packageMatch.Groups[1].Value -ne $canonical) {
            throw "pyproject.toml version $canonical does not match package version $($packageMatch.Groups[1].Value)."
          }

          if ($env:EVENT_NAME -eq "push") {
            $v = $env:REF_NAME -replace '^v', ''
            if ($v -ne $canonical) {
              throw "Tag version $v does not match canonical project version $canonical."
            }
          } else {
            # PR/manual builds are intentionally non-release artifacts. Keep
            # the canonical base visible while making each run unambiguous.
            $v = "$canonical-dev.$($env:RUN_NUMBER)"
          }
          Write-Host "Resolved version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm packaging/powerdc-setup-tool.spec

      - name: Build installer with Inno Setup
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Same resolve chain as scripts/build.ps1's Resolve-Iscc: windows-latest
          # ships Inno Setup 6 preinstalled at this fixed path (iscc is NOT
          # guaranteed to be on PATH there), fall back to PATH, then Chocolatey.
          function Resolve-Iscc {
              $fixedPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              if (Test-Path $fixedPath) { return $fixedPath }

              $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
              if ($isccCmd) { return $isccCmd.Source }

              Write-Host "Inno Setup compiler not found; attempting to install via Chocolatey..."
              choco install innosetup -y
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install Inno Setup via Chocolatey (exit code $LASTEXITCODE)."
              }
              if (Test-Path $fixedPath) { return $fixedPath }
              throw "Inno Setup compiler (ISCC.exe) was not found after installation."
          }

          $isccPath = Resolve-Iscc
          & $isccPath "/DMyAppVersion=$env:BUILD_VERSION" packaging\powerdc-setup-tool.iss
          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerDC-Setup-Tool-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/PowerDC-Setup-Tool-Setup-${{ steps.version.outputs.version }}.exe

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PowerDC-Setup-Tool-Setup-${{ needs.build.outputs.version }}
          path: dist/installer

      - name: Publish GitHub release (idempotent)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $assetName = "PowerDC-Setup-Tool-Setup-$($env:RELEASE_VERSION).exe"
          $assetPath = "dist/installer/$assetName"
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Expected installer artifact is missing: $assetPath"
          }
          $localHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()

          function Get-ReleaseInfo {
              $json = gh release view $tag --json assets 2>$null
              if ($LASTEXITCODE -ne 0) { return $null }
              try {
                  $release = (($json -join "`n") | ConvertFrom-Json)
                  return [pscustomobject]@{ Assets = @($release.assets) }
              } catch {
                  throw "GitHub returned invalid release asset metadata for $tag."
              }
          }

          function Assert-ExpectedAsset {
              param([object[]]$Assets)
              $matches = @($Assets | Where-Object { $_.name -eq $assetName })
              if ($matches.Count -eq 0) { return $false }
              if ($matches.Count -ne 1) {
                  throw "Release $tag contains duplicate assets named $assetName."
              }
              $digest = [string]$matches[0].digest
              $digestMatch = [regex]::Match($digest, '^(?i:sha256):([0-9a-f]{64})$')
              if (-not $digestMatch.Success) {
                  throw "Release asset $assetName has no verifiable SHA-256 digest."
              }
              if ($digestMatch.Groups[1].Value.ToLowerInvariant() -ne $localHash) {
                  throw "Release asset $assetName digest does not match the tagged build."
              }
              return $true
          }

          $release = Get-ReleaseInfo
          if ($null -eq $release) {
              gh release create $tag $assetPath --verify-tag `
                --title "SPD Manipulator for PowerDC $tag" `
                --notes "Automated release for $tag."
              if ($LASTEXITCODE -ne 0) {
                  # A concurrent publisher may have created the release. Re-read
                  # its assets and apply the same digest checks before success.
                  $release = Get-ReleaseInfo
                  if ($null -eq $release) {
                      throw "gh release create failed with exit code $LASTEXITCODE."
                  }
              }
              if ($null -eq $release) {
                  $release = Get-ReleaseInfo
                  if ($null -eq $release) {
                      throw "Release $tag was created but could not be read back for asset verification."
                  }
              }
          }

          if (-not (Assert-ExpectedAsset @($release.Assets))) {
              # Missing is repairable; an existing wrong digest is never
              # clobbered because it may be a release from another commit.
              gh release upload $tag $assetPath --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not upload missing release asset $assetName."
              }
              $release = Get-ReleaseInfo
              if ($null -eq $release -or -not (Assert-ExpectedAsset @($release.Assets))) {
                  throw "Uploaded release asset $assetName could not be verified."
              }
          }
          Write-Host "Release $tag asset $assetName verified at SHA-256 $localHash."
